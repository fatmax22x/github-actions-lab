name: Action Basics Demo

on: [push]

jobs:
  build:
    strategy:
  matrix:
    os: [ubuntu-latest, windows-latest, macos-latest]
runs-on: ${{ matrix.os }}
    steps:
      - name: Echo String
        run: echo "Welcome to GitHub Actions!"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Commands
        run: |
          echo "---"
          python --version
          python -c "print('Hello from Python in GitHub Actions!')"
          python -c "for i in range(3): print(f'Counting {i+1}')"
          echo "---"